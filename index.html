<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip Clock">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<title>Flip Clock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  /* ---------- themes ---------- */
  :root{                  /* dark (default): black page, white digits */
    --bg:#000;            /* page background */
    --card:#161616;       /* flap colour (dark charcoal so the flaps are visible on black) */
    --card-hi:#1e1e1e;
    --ink:#fff;           /* digits, colon, AM/PM, date */
    --shade:.5;           /* darkening of a flap while it turns */
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f2f2f2; --card:#ffffff; --card-hi:#fafafa; --ink:#111; --shade:.18; color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#f2f2f2; --card:#ffffff; --card-hi:#fafafa; --ink:#111; --shade:.18; color-scheme:light;
  }

  /* ---------- sizes: landscape (default) ---------- */
  :root{
    /* width of one big card: as big as the screen allows (row = 5.83 card widths, column = 2.25) */
    --W:min(
      calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) * 0.95 / 5.83),
      calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.94 / 2.25));
    --H:calc(var(--W) * 1.45);
    --R:calc(var(--W) * 0.08);
    --dur:280ms;          /* duration of each half of the flip */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;
    font-family:"Helvetica Neue",-apple-system,Helvetica,Arial,sans-serif;font-weight:700;
    color:var(--ink);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  .clock{display:flex;align-items:flex-end;gap:calc(var(--W)*0.18)}
  .group{display:flex;gap:calc(var(--W)*0.06)}

  .colon{height:var(--H);display:flex;flex-direction:column;justify-content:center;
    gap:calc(var(--H)*0.22)}
  .colon i{display:block;width:calc(var(--W)*0.13);height:calc(var(--W)*0.13);
    border-radius:50%;background:var(--ink)}

  .wrap{display:flex;flex-direction:column;align-items:center;gap:calc(var(--W)*0.14)}
  .date{font-size:calc(min(14vw, 38vh)*0.18);   /* fixed small size (A), same in every view */
   font-weight:600;letter-spacing:.02em;line-height:1;color:var(--ink);
    white-space:nowrap}   /* always one line */

  /* AM/PM printed inside the first hour card, bottom-left */
  #h{position:relative}
  .ampm{position:absolute;left:calc(var(--W)*0.09);bottom:calc(var(--H)*0.08);z-index:6;
    font-size:calc(var(--W)*0.17);letter-spacing:.04em;line-height:1;color:var(--ink);pointer-events:none}

  /* ---------- split-flap card ---------- */
  .card{position:relative;width:var(--W);height:var(--H);
    font-size:calc(var(--W)*1.08);perspective:calc(var(--H)*4);
    font-variant-numeric:tabular-nums}
  .small .card{width:calc(var(--W)*0.5);height:calc(var(--H)*0.5);font-size:calc(var(--W)*0.54)}
  .small{gap:calc(var(--W)*0.04)}

  .half{position:absolute;left:0;width:100%;height:50%;overflow:hidden;
    background:var(--card);backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .half.top{top:0;border-radius:var(--R) var(--R) 0 0;transform-origin:50% 100%;
    background:linear-gradient(var(--card-hi),var(--card))}
  .half.bottom{top:50%;border-radius:0 0 var(--R) var(--R);transform-origin:50% 0}
  .small .half.top{border-radius:calc(var(--R)*.6) calc(var(--R)*.6) 0 0}
  .small .half.bottom{border-radius:0 0 calc(var(--R)*.6) calc(var(--R)*.6)}

  .half span{position:absolute;left:0;width:100%;height:200%;
    display:flex;align-items:center;justify-content:center;line-height:1;color:var(--ink)}
  .half.top span{top:0}
  .half.bottom span{top:-100%}

  /* hinge line across the middle */
  .card::after{content:"";position:absolute;left:0;right:0;top:50%;height:max(2px,calc(var(--H)*0.012));
    transform:translateY(-50%);background:var(--bg);z-index:5}

  /* flipping flaps */
  .flap{z-index:3}
  .flap.top{animation:flipTop var(--dur) ease-in forwards}
  .flap.bottom{transform:rotateX(90deg);animation:flipBottom var(--dur) ease-out var(--dur) forwards}
  .flap.top::before,.flap.bottom::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
  .flap.top::before{background:#000;opacity:0;animation:shadeIn var(--dur) ease-in forwards}
  .flap.bottom::before{background:#000;opacity:var(--shade);animation:shadeOut var(--dur) ease-out var(--dur) forwards}
  @keyframes flipTop{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
  @keyframes flipBottom{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
  @keyframes shadeIn{to{opacity:var(--shade)}}
  @keyframes shadeOut{to{opacity:0}}

  /* connection light: hidden while all is well, red only when the ESP32 can't be reached */
  .status{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 8px);right:12px;
    width:6px;height:6px;border-radius:50%;background:#b3261e;opacity:0;transition:opacity .3s}
  .status.bad{opacity:1}
  .half{box-shadow:inset 0 0 0 1px rgba(127,127,127,.08)}
  html,body{transition:background .3s}

  /* ---------- portrait: hours above minutes, seconds below ---------- */
  @media (orientation: portrait){
    :root{--W:min(            /* row = 2.06 card widths, column = 4.35 */
      calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) * 0.93 / 2.06),
      calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.9 / 4.35))}
    .clock{flex-direction:column;align-items:center;gap:calc(var(--W)*0.1)}
    .colon{display:none}
    .small{margin-top:calc(var(--W)*0.04)}
    .wrap{gap:calc(var(--W)*0.16)}
    .date{font-size:min(calc(min(40vw, 19vh)*0.15), 6.5vw)}   /* fixed small size (A); fits the longest date */
  }

  /* theme toast (tap the date to switch Auto / Dark / Light) */
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);
    font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px;
    background:var(--ink);color:var(--bg);opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:.85}
  .date{cursor:pointer}
  /* tap the seconds: they fade out and the clock grows to fill the space.
     tap the minutes to bring the seconds back */
  @property --W{syntax:"<length>";inherits:true;initial-value:100px}
  :root{transition:--W .45s ease}
  :root.notrans{transition:none}
  #s{cursor:pointer;transition:opacity .3s}
  #s.hidden{opacity:0}
  html.nosec #s{display:none}
  #h{cursor:pointer;touch-action:manipulation}   /* no double-tap zoom on the hours */
  /* time-only view (tap the hours, step 3): just hours and minutes */
  html.minimal #date, html.minimal #s, html.minimal .flight{display:none}
  html.nosec #m{cursor:pointer}
  html.minimal #m{cursor:auto}
  /* seconds hidden: as big as the screen allows, with date and flight board still fitting.
     landscape: row = 4.61 card widths, column = 2.25; portrait: row = 2.06, column = 3.8 */
  @media (orientation: landscape){ html.nosec{--W:min(
      calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) * 0.95 / 4.61),
      calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.94 / 2.25))} }
  @media (orientation: portrait){ html.nosec{--W:min(
      calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) * 0.93 / 2.06),
      calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.9 / 3.8))} }
  /* landscape time-only view: as big as the screen allows (row = 4.61 card widths, card = 1.45 x width) */
  @media (orientation: landscape){
    html.minimal{--W:min(
      calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) * 0.96 / 4.61),
      calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.92 / 1.45))}
  }

  /* ---------- flight board under the time ---------- */
  /* width of one letter flap: shrinks for long city names (--n = number of letters) */
  .flight{--n:10;--L:min(calc(var(--W)*0.2), 6.4vw, calc(88vw / (var(--n) * 1.1 + 1.95)))}
  /* plane + city are centred together under the date */
  .flight{display:flex;align-items:center;justify-content:center;gap:calc(var(--L)*0.45);
    margin-top:calc(var(--L)*0.2)}
  .plane{position:relative;order:-1;flex:none;width:calc(var(--L)*1.5);height:calc(var(--L)*1.5)}
  .plane svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--ink);transition:opacity .4s}
  .plane .land{opacity:0}
  .plane.arr .land{opacity:1}
  .plane.arr .takeoff{opacity:0}
  .board{display:flex;gap:calc(var(--L)*0.1)}
  .board .card{width:var(--L);height:calc(var(--L)*1.4);font-size:calc(var(--L)*0.88);
    perspective:calc(var(--L)*6);font-variant-numeric:normal}
  .board .half.top{border-radius:calc(var(--L)*.14) calc(var(--L)*.14) 0 0}
  .board .half.bottom{border-radius:0 0 calc(var(--L)*.14) calc(var(--L)*.14)}
  .board .card::after{height:max(1px,calc(var(--L)*0.035))}

  /* colon: one soft, slow pulse, then rest */
  .colon i{animation:pulse 2s ease-in-out infinite;will-change:transform,opacity}
  @keyframes pulse{
    0%  {transform:scale(1);   opacity:.8}
    30% {transform:scale(1.04);opacity:1}
    70% {transform:scale(1);   opacity:.8}
    100%{transform:scale(1);   opacity:.8}
  }
  @media (prefers-reduced-motion: reduce){ .colon i{animation:none} }
  /* tap the colon to switch the pulse off / on */
  html.nopulse .colon i{animation:none;opacity:1}
  .colon{position:relative;cursor:pointer}
  .colon::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--W)*-0.09);right:calc(var(--W)*-0.09)}

  /* ---------- app: no ESP32 status dot; settings sheet (tap the flight board) ---------- */
  .status{display:none}
  .flight{cursor:pointer}
  .sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);padding:16px}
  .sheet[hidden]{display:none}
  .panel{width:min(360px,100%);max-height:100%;overflow:auto;background:var(--card);color:var(--ink);
    border-radius:18px;padding:20px;font-weight:400;font-size:15px;line-height:1.4;
    box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .panel h2{font-size:18px;font-weight:700;margin-bottom:14px}
  .panel label{display:block;font-weight:600;margin-bottom:12px}
  .panel input{display:block;width:100%;margin-top:6px;padding:10px 12px;font:inherit;font-size:16px;font-weight:400;
    color:var(--ink);background:var(--bg);border:1px solid rgba(127,127,127,.35);border-radius:10px;
    -webkit-user-select:text;user-select:text}
  .panel .hint{opacity:.65;font-size:13px;margin:-4px 0 12px}
  .panel .info{font-size:13px;margin-bottom:16px;min-height:1.4em}
  .panel .row{display:flex;gap:10px;justify-content:flex-end}
  .panel button{font:inherit;font-weight:600;padding:9px 16px;border-radius:10px;border:0;cursor:pointer;
    color:var(--ink);background:rgba(127,127,127,.18)}
  .panel button.primary{background:var(--ink);color:var(--bg)}


  /* Inter (SIL Open Font License, github.com/rsms/inter), trimmed to Latin letters, served with the page */
  @font-face{font-family:"Inter";src:url("inter-light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
  @font-face{font-family:"Inter";src:url("inter-medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:"Inter";src:url("inter-bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
  /* ---------- extra layouts (swipe left/right): clock & calendar, clock & weather ---------- */
  :root{--accent:#ff9f0a;--today:#ff3b30;--sun:#ffcc00;--rain:#5ac8fa}
  .lay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    --S:min(calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) * 0.42),
            calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.86));
    gap:calc(var(--S)*0.16);font-family:"Inter",-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
  html.standby .wrap, html.weather .wrap{display:none}
  html.standby .sbx, html.weather .wxl{display:flex}
  @media (orientation: portrait){
    .lay{flex-direction:column;
      --S:min(calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) * 0.84),
              calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.43));
      gap:calc(var(--S)*0.1)}
    .wx{align-items:center;text-align:center;padding-left:0}
    .wx .icon{margin-left:0;margin-right:0}
  }
  .analog{width:var(--S);height:var(--S);flex:none}
  .analog .tick{stroke:var(--ink);stroke-linecap:round;opacity:.45}
  .analog .tick.major{opacity:1}
  .analog .num{fill:var(--ink);font-weight:700;font-size:24px;text-anchor:middle;dominant-baseline:central}
  .analog.round .num{font-weight:300;font-size:20px}
  .analog .hand{stroke:var(--ink);stroke-linecap:round}
  .analog .sec{stroke:var(--accent)}
  .analog .cap{fill:var(--ink)}
  .analog .cap2{fill:var(--accent)}
  .cal{width:var(--S);flex:none;font-weight:300;color:var(--ink)}
  .cal .month{color:var(--today);font-size:calc(var(--S)*0.085);font-weight:500;letter-spacing:.03em;
    margin:0 0 calc(var(--S)*0.04) calc(var(--S)*0.02);cursor:pointer}
  .cal .grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:calc(var(--S)*0.022);text-align:center}
  .cal .wd{font-size:calc(var(--S)*0.062);font-weight:300;opacity:.9;padding-bottom:calc(var(--S)*0.03)}
  .cal .d{font-size:calc(var(--S)*0.07);line-height:1;height:calc(var(--S)*0.105);
    display:flex;align-items:center;justify-content:center}
  .cal .d.today span{display:flex;align-items:center;justify-content:center;
    width:calc(var(--S)*0.105);height:calc(var(--S)*0.105);border-radius:50%;background:var(--today);color:#fff}
  .wx{width:var(--S);flex:none;color:var(--ink);display:flex;flex-direction:column;justify-content:center;
    padding-left:calc(var(--S)*0.04)}
  .wx .city{display:flex;align-items:center;gap:calc(var(--S)*0.025);font-size:calc(var(--S)*0.085);
    font-weight:300;cursor:pointer;white-space:nowrap;overflow:hidden}
  .wx .city span{overflow:hidden;text-overflow:ellipsis}
  .wx .city svg{width:calc(var(--S)*0.06);height:calc(var(--S)*0.06);flex:none;fill:var(--ink)}
  .wx .temp{font-size:calc(var(--S)*0.4);font-weight:500;line-height:1;letter-spacing:-.03em;
    margin:calc(var(--S)*0.02) 0 calc(var(--S)*0.07)}
  .wx .icon{width:calc(var(--S)*0.22);height:calc(var(--S)*0.22);
    margin:calc(var(--S)*-0.045) 0 calc(var(--S)*-0.02) calc(var(--S)*-0.035)}
  .wx .icon img{display:block;width:100%;height:100%}
  .wx .desc{font-size:calc(var(--S)*0.075);font-weight:300}
  .wx .hl{font-size:calc(var(--S)*0.07);font-weight:300;opacity:.85;margin-top:calc(var(--S)*0.015)}
</style>
</head>
<body>
  <div class="wrap">
  <div class="date" id="date">&nbsp;</div>
  <div class="clock">
    <div class="group" id="h"><div class="card"></div><div class="card"></div><div class="ampm" id="ampm"></div></div>
    <div class="colon"><i></i><i></i></div>
    <div class="group" id="m"><div class="card"></div><div class="card"></div></div>
    <div class="group small" id="s"><div class="card"></div><div class="card"></div></div>
  </div>
  <div class="flight" id="flight" title="">
    <div class="board" id="board"></div>
    <div class="plane" id="plane" aria-hidden="true">
      <svg class="takeoff" viewBox="0 0 24 24"><path d="M2.5 19h19v2h-19v-2zm19.57-9.36c-.21-.8-1.04-1.28-1.84-1.06L14.92 10l-6.9-6.43-1.93.51 4.14 7.17-4.97 1.33-1.97-1.54-1.45.39 1.82 3.16.77 1.33 1.6-.43 5.31-1.42 4.35-1.16L21 11.49c.81-.23 1.28-1.05 1.07-1.85z"/></svg>
      <svg class="land" viewBox="0 0 24 24"><path d="M2.5 19h19v2h-19v-2zm7.18-5.73l4.35 1.16 5.31 1.42c.8.21 1.62-.26 1.84-1.06.21-.8-.26-1.62-1.06-1.84l-5.31-1.42-2.76-9.02L10.12 2v8.28L5.15 8.95l-.93-2.32-1.45-.39v5.17l1.6.43 5.31 1.43z"/></svg>
    </div>
  </div>
  </div>
  <div class="lay sbx" id="standby" aria-hidden="true">
    <svg class="analog" id="analog" viewBox="-100 -100 200 200" aria-label="Analog clock"></svg>
    <div class="cal" id="cal"></div>
  </div>
  <div class="lay wxl" id="weatherLay" aria-hidden="true">
    <svg class="analog round" id="analog2" viewBox="-100 -100 200 200" aria-label="Analog clock"></svg>
    <div class="wx" id="wx">
      <div class="city" id="wCityRow"><span id="wCity">&nbsp;</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 3 10.5l7.5 3L13.5 21z"/></svg></div>
      <div class="temp" id="wTemp">--°</div>
      <div class="icon" id="wIcon"></div>
      <div class="desc" id="wDesc">&nbsp;</div>
      <div class="hl" id="wHL">&nbsp;</div>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div class="toast" id="toast"></div>

  <div class="sheet" id="sheet" hidden>
    <form class="panel" id="settings">
      <h2>Flight board</h2>
      <label>AeroDataBox key
        <input id="sKey" type="password" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="X-RapidAPI-Key">
      </label>
      <p class="hint">Stored only on this iPhone. Without a key the board shows random cities.</p>
      <label>Airport
        <input id="sAirport" autocomplete="off" autocorrect="off" autocapitalize="characters" maxlength="4" placeholder="Nearest (uses your location)">
      </label>
      <p class="hint">ICAO code, e.g. EBBR Brussels, EBCI Charleroi. Leave empty for the nearest airport.</p>
      <p class="info" id="sInfo"></p>
      <div class="row">
        <button type="button" id="sRefresh">Update now</button>
        <button type="submit" class="primary">Done</button>
      </div>
    </form>
  </div>

<script>
(function(){
  const NBSP = "\u00a0";

  // ----- build cards -----
  const cards = {};
  ["h","m","s"].forEach(id=>{
    cards[id] = [...document.querySelectorAll("#"+id+" .card")];
    cards[id].forEach(c=>{
      c.innerHTML = '<div class="half top"><span></span></div><div class="half bottom"><span></span></div>';
      c.dataset.v = "";
    });
  });

  function setCard(card, v, animate){
    const old = card.dataset.v;
    if (old === v) return;
    card.dataset.v = v;
    const top = card.querySelector(".half.top:not(.flap) span");
    const bot = card.querySelector(".half.bottom:not(.flap) span");
    card.querySelectorAll(".flap").forEach(f=>f.remove());

    if (!animate || old === ""){ top.textContent = v; bot.textContent = v; return; }

    top.textContent = v;      // new top revealed behind the falling flap
    bot.textContent = old;    // old bottom stays until the flap lands

    const ft = document.createElement("div");
    ft.className = "half top flap";
    ft.innerHTML = "<span></span>"; ft.firstChild.textContent = old;

    const fb = document.createElement("div");
    fb.className = "half bottom flap";
    fb.innerHTML = "<span></span>"; fb.firstChild.textContent = v;

    card.append(ft, fb);
    fb.addEventListener("animationend", ()=>{
      bot.textContent = v; ft.remove(); fb.remove();
    }, {once:true});
  }

  // ----- time -----
  // The phone's own time zone database turns UTC into local time, summer/winter time included.
  // delta    = (local wall time in ms, expressed as if it were UTC) - Date.now()
  // utcDelta = (true UTC in ms) - Date.now()
  let delta = null, utcDelta = null;
  let tz = "Europe/Brussels";
  const statusEl = document.getElementById("status");
  const fmtCache = {};
  function wallMs(utc, zone){
    const f = fmtCache[zone] || (fmtCache[zone] = new Intl.DateTimeFormat("en-GB",{timeZone:zone,hourCycle:"h23",
      year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}));
    const p = {}; f.formatToParts(utc).forEach(x=>p[x.type]=x.value);
    return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second) + ((Math.floor(utc) % 1000) + 1000) % 1000;
  }

    }
    document.getElementById("wDesc").textContent = txt;
    document.getElementById("wHL").textContent = "H: " + Math.round(w.hi) + "°  L: " + Math.round(w.lo) + "°";
  }
  async function getJSON(url){
    const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 15000);
    try{ const r = await fetch(url, {signal: ctl.signal}); if (!r.ok) throw new Error(r.status); return await r.json(); }
    finally{ clearTimeout(to); }
  }
  async function wxLocation(){
    if (espLoc) return espLoc;
    if (window.isSecureContext && navigator.geolocation){
      try{
        const p = await new Promise((res, rej)=>navigator.geolocation.getCurrentPosition(res, rej,
                    {maximumAge: 3600e3, timeout: 15000}));
        const lat = p.coords.latitude, lon = p.coords.longitude;
        const saved = wxStore("wxLoc");
        if (saved && Math.abs(saved.lat - lat) < 0.05 && Math.abs(saved.lon - lon) < 0.08) return saved;
        let city = "";
        try{
          const g = await getJSON("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat.toFixed(4) +
                                  "&longitude=" + lon.toFixed(4) + "&localityLanguage=en");
          city = g.city || g.locality || "";
        }catch(e){}
        const loc = {lat, lon, city};
        wxStore("wxLoc", loc);
        return loc;
      }catch(e){}
    }
    return wxStore("wxLoc") || {lat: 50.85, lon: 4.35, city: "Brussels"};
  }
  let wxLoading = false;
  async function loadWeather(force){
    const saved = wxStore("wx");
    if (wxLoading || (!force && saved && Date.now() - saved.at < WX_REFRESH && (!espLoc || saved.city === espLoc.city))) return;
    wxLoading = true;
    try{
      const loc = await wxLocation();
      const j = await getJSON("https://api.open-meteo.com/v1/forecast?latitude=" + (+loc.lat).toFixed(3) +
        "&longitude=" + (+loc.lon).toFixed(3) + "&current=temperature_2m,weather_code,is_day" +
        "&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1");
      const w = {at: Date.now(), city: loc.city, t: j.current.temperature_2m, code: j.current.weather_code,
                 day: j.current.is_day === 1, hi: j.daily.temperature_2m_max[0], lo: j.daily.temperature_2m_min[0]};
      wxStore("wx", w);
      showWeather(w);
    }catch(e){
      if (!wxStore("wx")) document.getElementById("wDesc").textContent = "Weather unavailable";
    }
    wxLoading = false;
  }
  showWeather(wxStore("wx"));                      // last known weather straight away (also offline)
  setInterval(()=>{ if (root.classList.contains("weather")) loadWeather(); }, 60000);
  document.getElementById("wCityRow").addEventListener("click", cycleTheme);

  // ----- switching layouts -----
  const LAYOUTS = ["flip", "standby", "weather"];
  const LAYOUT_NAMES = {flip: "Flip clock", standby: "Clock & calendar", weather: "Clock & weather"};
  let layout = "flip", analogRaf = 0;
  function drawAnalog(){
    analogRaf = 0;
    const hands = clocks[layout];
    if (!hands || delta === null) return;
    const d = new Date(Date.now() + delta);                // local wall time (read with getUTC*)
    const s = d.getUTCSeconds() + d.getUTCMilliseconds() / 1000;
    const m = d.getUTCMinutes() + s / 60;
    const h = (d.getUTCHours() % 12) + m / 60;
    hands.h.setAttribute("transform", "rotate(" + (h * 30).toFixed(3) + ")");
    hands.m.setAttribute("transform", "rotate(" + (m * 6).toFixed(3) + ")");
    hands.s.setAttribute("transform", "rotate(" + (s * 6).toFixed(3) + ")");   // smooth sweep
    if (layout === "standby") drawCalendar(d);
    analogRaf = requestAnimationFrame(drawAnalog);
  }
  function kickAnalog(){ if (clocks[layout] && !analogRaf) analogRaf = requestAnimationFrame(drawAnalog); }
  function setLayout(name, announce){
    if (!LAYOUTS.includes(name)) name = "flip";
    layout = name;
    root.classList.toggle("standby", name === "standby");
    root.classList.toggle("weather", name === "weather");
    document.getElementById("standby").setAttribute("aria-hidden", name === "standby" ? "false" : "true");
    document.getElementById("weatherLay").setAttribute("aria-hidden", name === "weather" ? "false" : "true");
    try{ localStorage.setItem("flipLayout", name); }catch(e){}
    if (name === "flip"){ animate = false; render(); }       // flip cards jump to the right time, no flip storm
    else kickAnalog();
    if (name === "weather") loadWeather();
    if (announce) toast(LAYOUT_NAMES[name]);
  }
  function stepLayout(dir){
    setLayout(LAYOUTS[(LAYOUTS.indexOf(layout) + dir + LAYOUTS.length) % LAYOUTS.length], true);
  }
  try{ const l = localStorage.getItem("flipLayout"); if (l && l !== "flip") setLayout(l, false); }catch(e){}

  // swipe left = next layout, swipe right = previous (arrow keys on a computer)
  let sx = null, sy = null;
  document.addEventListener("touchstart", e=>{
    if (e.touches.length !== 1){ sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive: true});
  document.addEventListener("touchend", e=>{
    if (sx === null) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    const sheetEl = document.getElementById("sheet");
    if (sheetEl && !sheetEl.hidden) return;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) stepLayout(dx < 0 ? 1 : -1);
  }, {passive: true});
  document.addEventListener("keydown", e=>{
    if (e.key === "ArrowRight") stepLayout(1);
    if (e.key === "ArrowLeft") stepLayout(-1);
  });

  // ----- keep the screen on (iOS 16.4+) -----
  let wakeLock = null;
  async function keepAwake(){
    try{
      if ("wakeLock" in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
      }
    }catch(e){}
  }
  document.addEventListener("click", keepAwake);
  document.addEventListener("touchend", keepAwake);

  document.addEventListener("visibilitychange", ()=>{
    if (document.visibilityState === "visible"){
      animate = false;          // jump straight to the right time, no flip storm
      sync().then(()=>{ render(); kickAnalog(); if (layout === "weather") loadWeather(); });
      keepAwake();
    }
  });
  // works offline once opened
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
